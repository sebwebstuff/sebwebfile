
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Quicksand Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">  


	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>Pegfinity</title>

	<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #ffffff;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#welcome-screen {
	position: fixed;
	inset: 0;
	background: #d9ead3;
	display: flex;
	justify-content: center;
	align-items: center;
	z-index: 1000;
	font-family: 'Quicksand', sans-serif;
}

#welcome-window {
	background: #666;
	color: white;
	width: 90%;
	max-width: 500px;
	padding: 40px;
	border-radius: 16px;
	text-align: center;

}

#welcome-title {
	font-size: 36px;
	margin: 0 0 15px;
	color: #d9ead3;
}

#welcome-description {
	font-size: 16px;
	line-height: 1.6;
	color: #d9ead3;
	margin-bottom: 30px;
}

#continue-button {
	background: #d9ead3;
	color: #666;
	border: none;
	border-radius: 8px;
	padding: 14px 35px;
	font-size: 18px;
	font-weight: bold;
  font-family: 'Quicksand', sans-serif;
	cursor: pointer;
  margin: 10px;
}

#link-button {
	background: #d9ead3;
	color: #666;
	border: none;
	border-radius: 8px;
	padding: 14px 35px;
	font-size: 18px;
	font-weight: bold;
  font-family: 'Quicksand', sans-serif;
	cursor: pointer;
  margin: 10px;
}



@media (max-width: 500px) {
	#welcome-window {
		padding: 25px;
	}

	#welcome-title {
		font-size: 28px;
	}

	#welcome-description {
		font-size: 14px;
	}

	#continue-button {
		font-size: 16px;
		padding: 12px 30px;
	}
}
	</style>

	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
	<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>

<body>

	<div id="welcome-screen">
		<div id="welcome-window">

			<h1 id="welcome-title">
				Ported By Seb Web
			</h1>

			<p id="welcome-description">
				If You Like This Game, Please Buy It For Yourself On Steam
			</p>

			<button id="continue-button">
				Continue
			</button>
      <button id="link-button" onclick="window.open('https://store.steampowered.com/app/3947040/Pegfinity/', '_blank')">
				Steam Link
			</button>

		</div>
	</div>

	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="status">

		<img
			id="status-splash"
			class="show-image--true fullsize--false use-filter--true"
			src="index.png"
			alt=""
		>

		<progress id="status-progress"></progress>

		<div id="status-notice"></div>

	</div>

	<script src="index.js"></script>

	<script>

const GODOT_CONFIG = {
	"args": [],
	"canvasResizePolicy": 2,
	"emscriptenPoolSize": 8,
	"ensureCrossOriginIsolationHeaders": true,
	"executable": "https://raw.githubusercontent.com/sebwebstuff/sebwebfile/main/pegfinity/index.side",
	"experimentalVK": false,
	"fileSizes": {
		"index.pck": 11581108,
		"index.wasm": 1509558
	},
	"focusCanvas": true,
	"gdextensionLibs": [],
	"godotPoolSize": 4
};

const GODOT_THREADS_ENABLED = false;

const engine = new Engine(GODOT_CONFIG);

(function () {

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {

		if (statusMode === mode || !initializing) {
			return;
		}

		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}

		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';

		statusMode = mode;

	}

	function setStatusNotice(text) {

		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}

		const lines = text.split('\n');

		lines.forEach((line) => {

			statusNotice.appendChild(
				document.createTextNode(line)
			);

			statusNotice.appendChild(
				document.createElement('br')
			);

		});

	}

	function displayFailureNotice(err) {

		console.error(err);

		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}

		setStatusMode('notice');

		initializing = false;

	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {

		if (
			GODOT_CONFIG['serviceWorker'] &&
			GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] &&
			'serviceWorker' in navigator
		) {

			let serviceWorkerRegistrationPromise;

			try {

				serviceWorkerRegistrationPromise =
					navigator.serviceWorker.getRegistration();

			} catch (err) {

				serviceWorkerRegistrationPromise =
					Promise.reject(
						new Error('Service worker registration failed.')
					);

			}

			Promise.race([

				serviceWorkerRegistrationPromise.then((registration) => {

					if (registration != null) {
						return Promise.reject(
							new Error('Service worker already exists.')
						);
					}

					return registration;

				}).then(() => engine.installServiceWorker()),

				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),

			]).then(() => {

				window.location.reload();

			}).catch((err) => {

				console.error(
					'Error while registering service worker:',
					err
				);

			});

		} else {

			const missingMsg =
				'Error\nThe following features required to run Godot projects on the Web are missing:\n';

			displayFailureNotice(
				missingMsg + missing.join('\n')
			);

		}

	} else {

		const continueButton =
			document.getElementById('continue-button');

		const welcomeScreen =
			document.getElementById('welcome-screen');

		continueButton.addEventListener('click', function () {

			continueButton.disabled = true;

			welcomeScreen.style.display = 'none';

			setStatusMode('progress');

			engine.startGame({

				'onProgress': function (current, total) {

					if (current > 0 && total > 0) {

						statusProgress.value = current;
						statusProgress.max = total;

					} else {

						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');

					}

				},

			}).then(() => {

				setStatusMode('hidden');

			}, displayFailureNotice);

		});

	}

}());

	</script>

</body>
</html>
