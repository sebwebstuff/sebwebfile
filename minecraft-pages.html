<!-- 1.12.2 -->
<div class="image-container" onclick="open1122()" style="cursor: pointer;">
    <img class="main-img" src="https://cdn.jsdelivr.net/gh/sebwebstuff/sebwebfile/images/eaglercraft.png">
    <img class="hover-img" src="https://cdn.jsdelivr.net/gh/sebwebstuff/sebwebfile/images/black-fade.png">
    <div class="image-text">Eaglercraft 1.12.2</div>
</div>

<script>
async function open1122() {
    // Open the about:blank tab immediately
    const win = window.open("about:blank", "_blank");

    if (!win) {
        alert("Please allow popups for this website.");
        return;
    }

    try {
        // Download the HTML source
        const response = await fetch(
            "https://cdn.jsdelivr.net/gh/sebwebstuff/sebwebfile/eaglercraft-1.12.2/index.html"
        );

        if (!response.ok) {
            throw new Error("Could not download Game HTML");
        }

        let html = await response.text();

        // Make relative files load from the game folder
        const baseURL =
            "https://cdn.jsdelivr.net/gh/sebwebstuff/sebwebfile/eaglercraft-1.12.2/";

        if (!/<base\s/i.test(html)) {
            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1><base href="${baseURL}">`
            );
        }

        // Write the HTML into about:blank
        win.document.open();
        win.document.write(html);
        win.document.close();

    } catch (error) {
        console.error(error);

        win.document.body.innerHTML =
            "<h1>Failed to load Game</h1>" +
            "<p>" + error.message + "</p>";
    }
}
</script>

<!-- 1.12.2 End -->
