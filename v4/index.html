<head>
<link rel="stylesheet" href="style.css">
<!-- Quicksand Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>


<section class="home-screen" aria-label="Seb Web home">

<div class="home-content">
<h1>Seb Web</h1>
<div style="height: 4vw;"></div>

<button id="open-games" onclick="openAbout()" type="button">Games</button>

</div>

</section>

<script>
async function openAbout() {
    // Open the about:blank tab immediately
    const win = window.open("about:blank", "_blank");

    if (!win) {
        alert("Please allow popups for this website.");
        return;
    }

    try {
        // Download the HTML source
        const response = await fetch(
            "https://raw.githubusercontent.com/sebwebstuff/sebwebfile/main/v4/about.html"
        );

        if (!response.ok) {
            throw new Error("Could not download About HTML");
        }

        let html = await response.text();

        // Make relative files load from the Space Waves folder
        const baseURL =
            "https://raw.githubusercontent.com/sebwebstuff/sebwebfile/main/v4/about.html";

        if (!/<base\s/i.test(html)) {
            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1><base href="${baseURL}">`
            );
        }

        // Write the HTML into about:blank
        win.document.open();
        win.document.write(html);
        win.document.close();

    } catch (error) {
        console.error(error);

        win.document.body.innerHTML =
            "<h1>Failed to load Sebweb</h1>" +
            "<p>" + error.message + "</p>";
    }
}
</script>
