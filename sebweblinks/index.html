<!-- Blob URL -->
<center>
<button class="good" onclick="openBlobGame()">Blob URL (Best)</button>

<script>
async function openBlobGame() {
    const sourceURL = "https://raw.githubusercontent.com/sebwebstuff/sebwebfile/main/stuff-test/index.html";

    try {
        const response = await fetch(sourceURL, { cache: "no-store" });
        if (!response.ok) throw new Error("Failed to load game");

        const html = await response.text();
        const blob = new Blob([html], { type: "text/html" });
        const blobURL = URL.createObjectURL(blob);

        window.open(blobURL, "_blank");
    } catch (error) {
        console.error(error);
    }
}
</script>
