<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Rulehouse</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #unity-logo-title-footer,
      #unity-build-title,
      #unity-logo {
        display: none !important;
      }

      /* Fill the embedding window (e.g. itch's iframe) rather than a fixed-size
         centred box; Unity keeps the render target matched to the canvas. */
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #unity-container.unity-desktop {
        position: fixed;
        left: 0;
        top: 0;
        transform: none;
        width: 100%;
        height: 100%;
      }

      #unity-container.unity-desktop #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Fixed so it overlays the game; the footer is pushed off-screen by the full-height canvas. */
      #unity-fullscreen-button {
        position: fixed;
        bottom: 8px;
        right: 8px;
        width: 42px;
        height: 38px;
        background: url('TemplateData/fullscreen_button_sprite.png') center / contain no-repeat !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: pointer;
        opacity: 1;
        transition: filter 0.1s;
      }

      #unity-fullscreen-button:hover {
        filter: brightness(0.65);
      }

      #unity-fullscreen-button:active {
        filter: brightness(0.4);
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Rulehouse</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Unity fills these in at build time, so file names and compression
      // suffixes always match the build output.
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Build.data",
        frameworkUrl: buildUrl + "/Build.framework.js",
        codeUrl: buildUrl + "/Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Dalichrome",
        productName: "Rulehouse",
        productVersion: "demo-itch.1.2",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }
      // Desktop is sized by the CSS above; no explicit pixel size here.

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;

      // Without this a missing loader fails silently with only a console 404.
      script.onerror = () => {
        unityShowBanner("Failed to load " + loaderUrl, 'error');
      };

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
