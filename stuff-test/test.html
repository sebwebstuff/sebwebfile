<h1>These games have not been tested and most likely wont work</h1>

<!-- Rounds -->
<button onclick="openRounds()">Rounds</button>

<script>
async function openRounds() {
    // Open the about:blank tab immediately
    const win = window.open("about:blank", "_blank");

    if (!win) {
        alert("Please allow popups for this website.");
        return;
    }

    try {
        // Download the HTML source
        const response = await fetch(
            "https://cdn.jsdelivr.net/gh/nawsif/html/rounds.html"
        );

        if (!response.ok) {
            throw new Error("Could not download Space Waves HTML");
        }

        let html = await response.text();

        // Make relative files load from the Space Waves folder
        const baseURL =
            "https://cdn.jsdelivr.net/gh/nawsif/html/";

        if (!/<base\s/i.test(html)) {
            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1><base href="${baseURL}">`
            );
        }

        // Write the HTML into about:blank
        win.document.open();
        win.document.write(html);
        win.document.close();

    } catch (error) {
        console.error(error);

        win.document.body.innerHTML =
            "<h1>Failed to load Seb Web</h1>" +
            "<p>" + error.message + "</p>";
    }
}
</script>
